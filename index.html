<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="顧客との関係をひとつの場所で管理する顧客管理アプリ" />
    <title>紡ぐ — 顧客管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-screen" id="authScreen">
      <section class="auth-card" aria-labelledby="loginTitle">
        <div class="auth-brand" aria-label="紡ぐ">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M9 6.5c5.8 0 10.5 4.7 10.5 10.5S14.8 27.5 9 27.5M23 4.5c-5.8 0-10.5 4.7-10.5 10.5S17.2 25.5 23 25.5"/></svg>
          </span>
          <span>紡ぐ</span>
        </div>
        <p class="auth-eyebrow">CUSTOMER RELATIONSHIP</p>
        <h1 id="loginTitle">おかえりなさい</h1>
        <p class="auth-description">顧客管理を続けるにはログインしてください。</p>

        <form class="login-form" id="loginForm" novalidate>
          <label class="form-field" for="emailInput">
            <span>メールアドレス</span>
            <input id="emailInput" name="email" type="email" autocomplete="username" required aria-describedby="loginError" />
          </label>
          <label class="form-field" for="passwordInput">
            <span>パスワード</span>
            <span class="password-field">
              <input id="passwordInput" name="password" type="password" autocomplete="current-password" required aria-describedby="loginError" />
              <button id="passwordToggle" type="button" aria-label="パスワードを表示" aria-pressed="false">表示</button>
            </span>
          </label>
          <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
          <button class="login-button" type="submit">ログイン</button>
        </form>

        <div class="demo-account">
          <strong>デモアカウント</strong>
          <span>admin@tsumugu.jp</span>
          <span>customer2026</span>
        </div>
      </section>
    </main>

    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" aria-label="メインナビゲーション">
        <a class="brand" href="#" aria-label="紡ぐ ホーム">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M9 6.5c5.8 0 10.5 4.7 10.5 10.5S14.8 27.5 9 27.5M23 4.5c-5.8 0-10.5 4.7-10.5 10.5S17.2 25.5 23 25.5"/></svg>
          </span>
          <span>紡ぐ</span>
        </a>

        <nav class="nav-list">
          <button class="nav-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg>
            ダッシュボード
          </button>
          <button class="nav-item active" type="button" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            顧客
            <span class="nav-count" id="navCount">12</span>
          </button>
          <button class="nav-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            インポート
          </button>
        </nav>

        <div class="sidebar-footer">
          <button class="nav-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.55 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.18 15a1.7 1.7 0 0 0-1.09-1H3v-4h.09A1.7 1.7 0 0 0 4.6 8.55a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.18a1.7 1.7 0 0 0 1-1.09V3h4v.09A1.7 1.7 0 0 0 15.45 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.82 9c.13.42.4.78.76 1H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
            設定
          </button>
          <div class="profile-card">
            <div class="avatar avatar-user">KS</div>
            <div>
              <strong>佐藤 健一</strong>
              <span>管理者</span>
            </div>
            <button class="logout-button" id="logoutButton" type="button">ログアウト</button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="menu-button" id="menuButton" type="button" aria-label="メニューを開く">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="breadcrumb"><span>顧客管理</span><span>/</span><strong>顧客一覧</strong></div>
          <div class="topbar-actions">
            <button class="icon-button notification-button" type="button" aria-label="通知">
              <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
              <span></span>
            </button>
            <button class="help-link" type="button">ヘルプ</button>
          </div>
        </header>

        <section class="page-heading">
          <div>
            <p class="eyebrow">CUSTOMERS</p>
            <h1>顧客一覧</h1>
            <p>つながりを大切に、顧客情報を一か所で管理します。</p>
          </div>
          <button class="primary-button" id="addCustomerButton" type="button">
            <span>＋</span> 顧客を追加
          </button>
        </section>

        <section class="workspace" aria-label="顧客管理ワークスペース">
          <div class="customer-panel">
            <div class="search-row">
              <label class="search-box">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                <input id="searchInput" type="search" placeholder="顧客名で検索" autocomplete="off" />
                <kbd>⌘ K</kbd>
              </label>
              <button class="filter-button" id="filterButton" type="button" aria-pressed="false">
                <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
                絞り込み
              </button>
            </div>

            <div class="list-meta">
              <span><strong id="resultCount">12</strong>名の顧客</span>
              <button id="sortButton" type="button">更新順 <span>↓</span></button>
            </div>
            <div class="customer-list" id="customerList" aria-live="polite"></div>
          </div>

          <aside class="detail-panel" id="detailPanel" aria-label="顧客詳細"></aside>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
      <span>メモを保存しました</span>
    </div>
    <div class="scrim" id="scrim"></div>

    <script src="app.js"></script>
  </body>
</html>
